name: CI on push

on: pull_request

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install pre-commit

      - name: Install pre-commit hooks
        run: pre-commit install

      - name: Run pre-commit hooks for linting and other checks
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, apptainer]
    env:
      DRAM_ENGINE: ${{ matrix.engine }}
      KOFAM_RELEASE: "2022-08-01"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # bin/rules (dram-rules) is a submodule; Summarize/Traits need its data files
          submodules: true
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
      - name: Set up Apptainer
        if: matrix.engine == 'apptainer'
        uses: eWaterCycle/setup-apptainer@v3.0.0
      # KOfam is KEGG-derived, so its mini database is built here, not committed.
      # KOFAM_RELEASE must match the release databases/kofam was built from (the one
      # `build_mini_dbs.py select` chose ids.txt against); see tests/data/db/README.md.
      - name: Restore KOfam mini database
        id: kofam
        uses: actions/cache@v4
        with:
          path: |
            tests/data/db/kofam/kofam.hmm
            tests/data/db/kofam/kofam_ko_list.tsv
          key: kofam-${{ env.KOFAM_RELEASE }}-${{ hashFiles('tests/data/db/kofam/ids.txt', 'tests/scripts/build_mini_dbs.py') }}
      - name: Build KOfam mini database
        if: steps.kofam.outputs.cache-hit != 'true'
        run: |
          # GenomeNet's HTTPS mirror resets the connection for archives; FTP works
          base=ftp://ftp.genome.jp/pub/db/kofam/archives/$KOFAM_RELEASE
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/profiles.tar.gz" "$base/profiles.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ko_list.gz" "$base/ko_list.gz"
          pixi run python tests/scripts/build_mini_dbs.py kofam \
            --profiles "$RUNNER_TEMP/profiles.tar.gz" --ko-list "$RUNNER_TEMP/ko_list.gz" \
            --out tests/data/db/kofam
      # Nextflow doesn't retry a failed apptainer image download, and gives each nf-test its own
      # image cache; pull every image once, with retries, into one cache all tests share.
      # (Docker pulls inside the task, so conf/base.config retries those on exit 125.)
      - name: Pull apptainer images
        if: matrix.engine == 'apptainer'
        run: |
          echo "NXF_APPTAINER_CACHEDIR=$RUNNER_TEMP/apptainer" >> "$GITHUB_ENV"
          pixi run nextflow -q inspect main.nf -profile test,apptainer -c tests/nextflow.config -c tests/pr.config \
            --outdir "$RUNNER_TEMP/inspect" --summarize --traits --visualize --qc \
            > "$RUNNER_TEMP/images.json"
          pixi run python tests/scripts/pull_images.py "$RUNNER_TEMP/images.json" "$RUNNER_TEMP/apptainer"
      - name: Run PR-gate tests
        run: pixi run test
